Dataset:
    workspace: "data/keble-college-04/"
    # workspace: "data/blenheim-palace-05/"
    # workspace: "data/christ-church-02/"
    # workspace: "data/observatory-quarter-01/"
    data_dir: "vilens-slam/"
    pc_dir: "undist-clouds/"
    pose_file: "poses.txt"
    out_dir: "output/keble-college/" 
    # out_dir: "output/blenheim-palace/" 
    # out_dir: "output/christ-church/" 
    # out_dir: "output/observatory-quarter/" 

DataLoader:
    min_range: 2.5
    max_range: 80.0
    use_filter: True
    sor_nn: 25
    sor_std: 2.5

HashTable:
    voxel_size: 0.5            #体素网格的大小
    ht_size: 0x80000       #哈希表的大小
    skip_load:  1                 #分配体素时，间隔多少帧加载一帧
    inval_val: 999999
    res_scale: 1                #分配哈希体素时的点云下采样比例因子
    down_vox_size: 0.05

Network:
    num_layers: 2
    hidden_dim: 64

LocalSDF:
    resolution: 0.3  # 0.4
    query_nn_k: 12
    gss_vox_size: 0.5
    exe_densitify: True                         # 是否执行致密化
    add_scale_loss: False                   # 是否加入scale_loss
    n_iters_densitify: 200                # 间隔几次进行致密化
    grad_threshold_densitify: 0.0002 # 0.00008    # 平移梯度超过该值时进行克隆和分裂
    sdf_threshold_densitify:  0.2      # 局部SDF删除时的sdf阈值，删除大于该值的局部SDF
    consider_large_gs: False    # 在gs致密化时是否考虑过大的GS

Train:
    n_epoch: 10000                 #epoch次数
    n_step: 1                 #每个epoch训练的次数
    n_views_total: 1 #120    #每个epoch加载的帧数
    lr_ratio: 0.1           # 学习率下降到原来的lr_ratio倍
    freeze_after_iters: 15000   # N次迭代后固定住decoder的参数
    interval_skip:  1     # 训练数据每interval_skip帧取一帧
    sdf_th_after_iters: 1200   # N次迭代后增加致密化sdf阈值
    
RaySample:
    n_views_select:  1          #每个step进行采样的帧数
    n_rays: 2048                             #每张图像上采样的光线数
    n_max_interset: 10           #光线相交的最大网格数
    sur_behind_dis:  0.1       #sdf采样时物体表面之后的采样距离
    n_surf_samples: 30           #sdf采样时在物体表面采样的个数
    s_dev: 0.02                  #sdf表面采样的标准差
    step_size_sdf: 0.05            #sdf采样时沿光线采样的间距

Loss:
    trunc_distance: 0.30
    trunc_weight: 1             #截断距离内的sdf_loss权重

Save:
    n_every_save_iters: 5000
    grid_res: 5    # 分辨率
    mesh_min_nn: 4   # 相交局部SDF数小于该值的采样点不提取mesh
